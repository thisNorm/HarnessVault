version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/apps/api", "/apps/web", "/packages/domain"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 20
    # TypeScript 메이저는 자동으로 올리지 않는다.
    # 7.x는 typescript-eslint(<6.1.0 peer)와 공존할 수 없고,
    # NestJS DI가 요구하는 emitDecoratorMetadata 지원도 확인되지 않았다.
    # 올릴 때는 두 가지를 직접 검증한 뒤 수동으로 올린다.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      all-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
