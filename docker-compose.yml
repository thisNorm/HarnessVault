services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: harnessvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harnessvault
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U harness -d harnessvault']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
